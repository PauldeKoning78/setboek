<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Setboek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setboek">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Krachttraining loggen: routines, rusttimer, records en voortgang.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}

/* Layout: iOS-stijl, grote titel bovenaan, gegroepeerde kaarten, vaste tabbalk onderaan; training opent als volledig scherm. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#efeff4; --fill2:#e4e4ea; --text:#111114; --muted:#86868c;
  --line:#e3e3e8; --accent:#0a7cff; --accent-soft:rgba(10,124,255,.11); --on-accent:#ffffff;
  --green:#28b14c; --green-soft:rgba(52,199,89,.15); --warm:#f59e0b; --warm-soft:rgba(245,158,11,.14);
  --red:#ff3b30; --ss1:#8b5cf6; --ss2:#f59e0b; --ss3:#14b8a6; --ss4:#ec4899;
  --sheet:#ffffff; --backdrop:rgba(0,0,0,.32); --shadow:0 10px 30px rgba(20,20,40,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Display","Inter",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c; --text:#f5f5f7; --muted:#98989f;
  --line:#2a2a2d; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --on-accent:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.17); --warm:#ffb020; --warm-soft:rgba(255,176,32,.16);
  --sheet:#1c1c1e; --backdrop:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c; --text:#f5f5f7; --muted:#98989f;
  --line:#2a2a2d; --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --on-accent:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.17); --warm:#ffb020; --warm-soft:rgba(255,176,32,.16);
  --sheet:#1c1c1e; --backdrop:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

#main{padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:680px;margin:0 auto}
#main.has-mini{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 14px}
.lt h1{font:800 34px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:17px;margin:6px 0 4px;min-height:40px}

.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.flush{padding:0 16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sec-h .link{text-transform:none;letter-spacing:0;font-size:15px}
.link{color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--fill);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;min-height:52px;font-size:17px;border-radius:14px}
.btn.small{min-height:34px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn.green{background:var(--green);color:#fff}

.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li b{display:block;font-size:16px;font-weight:600}
.li small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--fill2)}

/* week */
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:12px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:5px}
.bars i{display:block;width:100%;border-radius:6px;background:var(--accent);min-height:4px}
.bars i.zero{background:var(--fill)}
.bars .today{color:var(--text);font-weight:700}

/* history */
.wcard{display:block;width:100%;text-align:left}
.wcard h3{margin:0;font-size:17px;font-weight:700}
.wmeta{color:var(--muted);font-size:13.5px;margin-top:3px}
.wlines{margin-top:10px;font-size:14.5px;line-height:1.6}
.wlines span{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:3px;background:var(--warm-soft);color:var(--warm);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;vertical-align:1px}
.month-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 4px 8px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:var(--r);padding:12px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font:700 22px/1.2 var(--display);margin-top:4px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
svg.chart{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
svg.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--accent)}
svg.chart .bar.dim{fill:var(--accent);opacity:.35}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.chart .area{fill:var(--accent-soft)}
svg.chart .dot{fill:var(--card);stroke:var(--accent);stroke-width:2}
svg.chart .end{fill:var(--accent)}
svg.chart text.val{fill:var(--text);font-weight:700;font-size:12px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.hbar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.hbar em{font-style:normal;text-align:right;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .dh{font-size:11px;color:var(--muted);padding-bottom:4px;text-transform:uppercase}
.cal button{aspect-ratio:1;max-width:100%;border-radius:50%;font-size:14px;display:grid;place-items:center}
.cal button.has{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.out{visibility:hidden}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:15px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* exercises */
.search{display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:11px;padding:0 10px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;background:none;min-height:40px;font-size:17px;outline:none;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;color:var(--text)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.mavatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sel .mavatar{background:var(--accent);color:var(--on-accent)}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec div{background:var(--fill);border-radius:12px;padding:10px 12px}
.rec span{display:block;font-size:12px;color:var(--muted)}
.rec b{font-size:17px}

/* tab bar + mini */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:64px;padding:2px 0}
.tab.on{color:var(--accent)}
.tab svg.i{width:25px;height:25px}
.mini{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:660px;margin:0 auto;text-align:left}
.mini .pulse{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* editor */
#editor{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ed-top{background:var(--card);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.ed-top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;max-width:680px;margin:0 auto}
.ed-top .ttl{font-weight:700;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-stats{display:flex;gap:26px;margin:8px auto 0;max-width:680px;padding:0 4px}
.ed-stats span{display:block;font-size:12px;color:var(--muted)}
.ed-stats b{font-size:17px}
#edScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(12px,env(safe-area-inset-right,0px)) 140px max(12px,env(safe-area-inset-left,0px))}
#edScroll>.wrap{max-width:680px;margin:0 auto}
.name-in{width:100%;border:0;background:none;font:800 26px/1.2 var(--display);padding:4px 4px;outline:none;letter-spacing:-.01em}
.note-in{width:100%;border:0;background:none;resize:none;font-size:16px;padding:4px;outline:none;color:var(--text);min-height:28px}
.note-in::placeholder,.name-in::placeholder{color:var(--muted)}
.exc{background:var(--card);border-radius:var(--r);padding:12px 12px 10px;margin-top:12px;position:relative}
.exc.ss{border-left:4px solid var(--ssc)}
.exh{display:flex;align-items:center;gap:8px}
.exname{flex:1;text-align:left;font-weight:700;font-size:17px;color:var(--accent);min-width:0}
.ss-tag{font-size:12px;font-weight:700;color:var(--ssc);margin:2px 0 0}
.exc .note-in{font-size:15px;color:var(--text);padding:6px 0 2px}
.restbtn{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;font-weight:600;padding:4px 0 8px}
.sh,.sr{display:grid;gap:6px;align-items:center}
.sh{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 4px;text-align:center}
.sr{padding:4px;border-radius:9px;margin-bottom:3px;text-align:center}
.sr.done{background:var(--green-soft)}
.sr .setno{font-weight:700;height:36px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.sr .setno.w{color:var(--warm)} .sr .setno.d{color:var(--ss1)} .sr .setno.f{color:var(--red)}
.sr .prev{color:var(--muted);font-size:14px;height:36px;display:grid;place-items:center;white-space:nowrap;overflow:hidden;min-width:0}
.sr input{width:100%;height:36px;border:0;border-radius:8px;background:var(--fill);text-align:center;font-size:17px;font-weight:600;outline:none;padding:0 2px;min-width:0}
.sr input::placeholder{color:var(--muted);font-weight:500}
.sr.done input{background:transparent}
.sr .rpe{height:36px;border-radius:8px;background:var(--fill);font-size:14px;font-weight:600;color:var(--muted)}
.sr .rpe.v{color:var(--text)}
.sr.done .rpe{background:transparent}
.ck{width:36px;height:36px;border-radius:9px;background:var(--fill);display:grid;place-items:center;color:var(--muted);margin:0 auto}
.sr.done .ck{background:var(--green);color:#fff}
.sr .tro{color:var(--warm)}
.addset{width:100%;min-height:38px;border-radius:9px;background:var(--fill);font-weight:600;font-size:15px;margin-top:6px}
.ed-actions{display:grid;gap:10px;margin-top:16px}
.restbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:55;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;max-width:660px;margin:0 auto}
.restbar .t{font:700 26px/1 var(--display)}
.prog{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sheet */
#sheet{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:var(--backdrop)}
.panel{background:var(--sheet);border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));width:100%;max-width:680px;margin:0 auto;animation:up .22s ease-out}
.panel.tall{height:92%;max-height:92%;display:flex;flex-direction:column;overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:2px auto 10px}
.panel h2{font:700 20px/1.25 var(--display);margin:0 0 4px}
.panel p.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.menu{display:grid;gap:0;margin:6px 0 4px}
.menu button{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--red)}
.menu button.on{color:var(--accent);font-weight:600}
.rpegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rpegrid button{min-height:52px;border-radius:12px;background:var(--fill);font-weight:700;font-size:18px}
.rpegrid button small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.rpegrid button.on{background:var(--accent);color:var(--on-accent)}
.rpegrid button.on small{color:var(--on-accent)}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;min-height:46px;border:0;border-radius:11px;background:var(--fill);padding:0 12px;font-size:17px;outline:none}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{padding:8px 13px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:600}
.opt button.on{background:var(--accent);color:var(--on-accent)}
.pick-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.pick-foot{padding-top:10px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sumgrid div{background:var(--fill);border-radius:12px;padding:10px}
.sumgrid span{display:block;font-size:12px;color:var(--muted)}
.sumgrid b{font-size:18px}
.prline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.prline:last-child{border-bottom:0}
.prline svg{color:var(--warm)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:100;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:var(--shadow);max-width:90%}
.dsets{font-size:15px}
.dsets .r{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:5px 0;align-items:center}
.dsets .r .n{font-weight:700;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="main"></div>
<div id="mini"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="editor" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const nf1 = new Intl.NumberFormat('nl-NL', {maximumFractionDigits: 1});
const nf0 = new Intl.NumberFormat('nl-NL', {maximumFractionDigits: 0});
const kg = v => nf1.format(v);
const n0 = v => nf0.format(v);
const parseNum = s => { if (s === '' || s == null) return null; const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : null; };
const parseTime = s => { if (s === '' || s == null) return null; s = String(s).trim(); if (s.includes(':')) { const [m, r] = s.split(':'); const v = (parseInt(m) || 0) * 60 + (parseInt(r) || 0); return v || null; } const n = parseInt(s); return isFinite(n) && n > 0 ? n : null; };
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const clock = ms => { let s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const dur = ms => { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' u ' + (m % 60) + ' min'; };
const fDay = new Intl.DateTimeFormat('nl-NL', {weekday: 'short', day: 'numeric', month: 'short'});

let wv = 0; const cache = {};
function touchWorkouts() { wv++; S.workouts.sort((a, b) => a.start - b.start); }
function memo(key, fn) { const c = cache[key]; if (c && c.v === wv) return c.val; const val = fn(); cache[key] = {v: wv, val}; return val; }
function exList() { return LIB.concat(S.custom); }
function exMap() { return memo('exmap' + S.custom.length, () => Object.fromEntries(exList().map(e => [e.id, e]))); }
function exInfo(id, fallbackName) { return exMap()[id] || {id, name: fallbackName || 'Onbekende oefening', muscle: 'Overig', equip: 'Overig', type: 'wr'}; }
function exType(id) { return exInfo(id).type; }
function lastSets(excludeId) { return memo('last' + (excludeId || ''), () => { const m = {}; for (let i = S.workouts.length - 1; i >= 0; i--) { const w = S.workouts[i]; if (w.id === excludeId) continue; for (const e of w.exercises) if (!m[e.exId]) m[e.exId] = e.sets; } return m; }); }
function e1rm(k, r) { return r <= 0 ? 0 : r === 1 ? k : k * (1 + r / 30); }
function setStats(acc, s, t) {
  if (s.type === 'w') return acc;
  if (t === 'wr' && s.reps > 0) { const k = s.kg || 0; acc.w = Math.max(acc.w, k); acc.orm = Math.max(acc.orm, e1rm(k, s.reps)); acc.vol = Math.max(acc.vol, k * s.reps); acc.reps = Math.max(acc.reps, s.reps); }
  if (t === 'r' && s.reps > 0) acc.reps = Math.max(acc.reps, s.reps);
  if (t === 't' && s.sec > 0) acc.time = Math.max(acc.time, s.sec);
  return acc;
}
const zero = () => ({w: 0, orm: 0, vol: 0, reps: 0, time: 0, n: 0});
const PRNAMES = {w: 'Zwaarste gewicht', orm: 'Beste geschatte 1RM', vol: 'Beste setvolume', reps: 'Meeste reps', time: 'Langste tijd'};
const PRKEYS = {wr: ['w', 'orm', 'vol'], r: ['reps'], t: ['time']};
function fmtPR(k, v) { return k === 'reps' ? v + ' reps' : k === 'time' ? mmss(v) : kg(v) + ' kg'; }
/* PRs per workout (compared with everything before it) */
function prMap() {
  return memo('prs', () => {
    const best = {}, out = {};
    for (const w of S.workouts) {
      const list = [];
      for (const e of w.exercises) {
        const t = exType(e.exId); const prev = best[e.exId] || zero(); const cur = e.sets.reduce((a, s) => setStats(a, s, t), zero());
        if (prev.n > 0) for (const k of PRKEYS[t]) if (cur[k] > prev[k] + 1e-9) list.push({exId: e.exId, k, v: cur[k]});
        const nb = {...prev}; for (const k of ['w','orm','vol','reps','time']) nb[k] = Math.max(prev[k], cur[k]); nb.n = prev.n + 1; best[e.exId] = nb;

}

}

/* ---------- cloud sync (Claude account, private per person) ---------- */
let cloud = null;
const writers = {};
function cloudWrite(key, ref, getData) {
  if (!cloud) return;
  const w = writers[key] || (writers[key] = {busy: false, pending: false});
  w.ref = ref; w.get = getData;
  if (w.busy) { w.pending = true; return; }
  (async () => {
    w.busy = true;
    do { w.pending = false; const d = w.get();
      try { if (d === null) await w.ref.delete(); else await w.ref.set(d); setCloud('ok'); }
      catch (e) { setCloud(e && e.code === 'quota_exceeded' ? 'full' : 'err'); }
    } while (w.pending);
    w.busy = false;
  })();
}
const metaData = () => ({v: 1, routines: S.routines, custom: S.custom, settings: S.settings});
function saveMeta() { saveLocal(); if (cloud) cloudWrite('meta', cloud.meta, metaData); }
function saveWorkout(w) { saveLocal(); if (cloud) cloudWrite('w:' + w.id, cloud.wcol.doc(w.id), () => clone(w)); }
function deleteWorkoutCloud(id) { saveLocal(); if (cloud) cloudWrite('w:' + id, cloud.wcol.doc(id), () => null); }
let activeTimer = 0;
function saveActive(now) {
  if (S.active) S.active.touched = Date.now();
  saveLocal(); clearTimeout(activeTimer);
  const go = () => { if (cloud) cloudWrite('active', cloud.active, () => S.active ? {w: clone(S.active)} : null); };
  if (now) go(); else activeTimer = setTimeout(go, 1200);
}
function setCloud(s) { ui.cloud = s; const el = document.getElementById('cloudState'); if (el) el.textContent = cloudLabel(); }
function cloudLabel() { return {ok: 'Opgeslagen in je Claude-account, ook op je andere apparaten.', local: 'Je trainingen staan alleen op dit apparaat, in deze browser. Maak af en toe een back-up en bewaar die bijvoorbeeld in iCloud Drive.', loading: 'Verbinden met je account…', err: 'Opslaan in je account lukt nu niet. Je data staat wel op dit apparaat.', full: 'Opslag in je account is vol.'}[ui.cloud] || ''; }
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  setCloud('loading');
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { setCloud('local'); return; }
    const meta = db.doc('data/users/' + id + '/meta');
    const ref = {meta, active: db.doc('data/users/' + id + '/active'), wcol: meta.collection('workouts')};
    const timeout = new Promise((_, rej) => setTimeout(() => rej({code: 'timeout'}), 10000));
    const [m, a, ws] = await Promise.race([Promise.all([ref.meta.get(), ref.active.get(), ref.wcol.get()]), timeout]);
    cloud = ref;
    const remoteW = ws.docs.map(d => clone(d.data()));
    const remoteIds = new Set(remoteW.map(w => w.id));
    const localOnly = S.workouts.filter(w => !remoteIds.has(w.id));
    if (m.exists) {
      const md = clone(m.data());
      S.routines = md.routines || []; S.custom = md.custom || []; S.settings = Object.assign({rest: 90}, md.settings);
    } else saveMeta();
    S.workouts = remoteW.concat(localOnly);
    localOnly.forEach(saveWorkout);
    const ra = a.exists ? clone(a.data()).w : null;
    if (ra && (!S.active || (ra.touched || 0) > (S.active.touched || 0))) S.active = ra;
    else if (S.active) saveActive(true);
    touchWorkouts(); saveLocal(); setCloud('ok'); renderAll();
  } catch (e) { cloud = null; setCloud(e && e.code === 'timeout' ? 'err' : 'local'); }
}
async function refreshCloud() {
  if (!cloud || ui.ed || Object.values(writers).some(w => w.busy)) return;
  try {
    const [m, ws] = await Promise.all([cloud.meta.get(), cloud.wcol.get()]);
    if (ui.ed) return;
    if (m.exists) { const md = clone(m.data()); S.routines = md.routines || []; S.custom = md.custom || []; S.settings = Object.assign({rest: 90}, md.settings); }
    S.workouts = ws.docs.map(d => clone(d.data())); touchWorkouts(); saveLocal(); renderMain();
  } catch (e) {}
}

  editRoutine(el) { const r = S.routines.find(x => x.id === el.dataset.id); closeAllSheets(); ui.ed = {mode: 'routine', id: r.id, w: clone(r)}; renderEditor(); },
  dupRoutine(el) { const r = S.routines.find(x => x.id === el.dataset.id); const c = clone(r); c.id = uid(); c.name = r.name + ' (kopie)'; S.routines.push(c); saveMeta(); closeAllSheets(); renderMain(); toast('Routine gedupliceerd'); },
  deleteRoutine(el) { const id = el.dataset.id; const r = S.routines.find(x => x.id === id); confirmSheet('Routine verwijderen?', `"${r.name}" wordt verwijderd. Je trainingen blijven bewaard.`, 'Verwijderen', () => { S.routines = S.routines.filter(x => x.id !== id); saveMeta(); ui.sheets = []; if (ui.ed && ui.ed.mode === 'routine') ui.ed = null; renderAll(); toast('Routine verwijderd'); }); },
  openActive() { if (!S.active) return; ui.ed = {mode: 'live'}; renderMini(); renderEditor(); },
  minimize() { ui.ed = null; renderEditor(); renderMini(); renderMain(); },
  edCancel() { ui.ed = null; renderEditor(); },
  edSave() {
    const {mode, w, id} = ui.ed;
    if (mode === 'routine') {
      if (!w.exercises.length) return toast('Voeg minstens één oefening toe');
      const r = {id: id || uid(), name: (w.name || '').trim() || 'Nieuwe routine', note: w.note || '', exercises: w.exercises.map(e => ({exId: e.exId, rest: e.rest, superset: e.superset, sets: e.sets.map(s => ({type: s.type, tkg: s.tkg ?? null, treps: s.treps ?? null, tsec: s.tsec ?? null}))}))};
      cleanSS(r); const i = S.routines.findIndex(x => x.id === r.id); if (i >= 0) S.routines[i] = r; else S.routines.push(r);
      saveMeta(); ui.ed = null; renderEditor(); renderMain(); toast('Routine opgeslagen'); return;
    }
    // edit an existing workout: keep sets that have values
    const keep = []; for (const e of w.exercises) { const t = exType(e.exId); const sets = e.sets.filter(s => t === 't' ? s.sec > 0 : s.reps > 0).map(s => ({type: s.type, kg: t === 'wr' ? (s.kg ?? 0) : null, reps: s.reps, sec: s.sec, rpe: s.rpe})); if (sets.length) keep.push({exId: e.exId, name: exInfo(e.exId).name, rest: e.rest, superset: e.superset, note: e.note || '', sets}); }
    if (!keep.length) return toast('Vul minstens één set in');
    const i = S.workouts.findIndex(x => x.id === id); const nw = Object.assign({}, S.workouts[i], {name: (w.name || '').trim() || S.workouts[i].name, note: w.note || '', exercises: keep}); cleanSS(nw);
    S.workouts[i] = nw; touchWorkouts(); saveWorkout(nw); ui.ed = null; renderEditor(); renderMain(); toast('Training bijgewerkt');
  },
  editWorkout(el) { const w = S.workouts.find(x => x.id === el.dataset.id); const d = clone(w); d.exercises.forEach(e => e.sets.forEach(s => { s.done = true; })); ui.ed = {mode: 'edit', id: w.id, w: d}; renderEditor(); },
  deleteWorkout(el) { const id = el.dataset.id; confirmSheet('Training verwijderen?', 'Deze training en de sets erin worden definitief verwijderd.', 'Verwijderen', () => { S.workouts = S.workouts.filter(x => x.id !== id); touchWorkouts(); deleteWorkoutCloud(id); ui.sheets = []; ui.page = null; renderAll(); toast('Training verwijderd'); }); },
  workoutToRoutine(el) { const w = S.workouts.find(x => x.id === el.dataset.id); const r = {id: uid(), name: w.name, note: '', exercises: workoutToRoutineData(w)}; S.routines.push(r); saveMeta(); ui.sheets = []; renderAll(); toast('Opgeslagen als routine "' + w.name + '"'); },
  updateRoutine(el) { const w = S.workouts.find(x => x.id === el.dataset.id); const r = S.routines.find(x => x.id === w.routineId); if (!r) return; r.exercises = workoutToRoutineData(w); saveMeta(); ui.sheets = []; renderAll(); toast('Routine bijgewerkt'); },
  finish() {
    const w = S.active; const done = wSets(w, true); const undone = wSets(w) - done;
    if (!done) return confirmSheet('Nog geen sets afgevinkt', 'Vink sets af met het vinkje om ze op te slaan, of verwijder deze training.', 'Training verwijderen', () => A.discardNow());
    if (undone) return openSheet({type: 'finishCheck', undone});
    finishWorkout();
  },
  finishNow() { finishWorkout(); },
  discard() { confirmSheet('Training verwijderen?', 'Alles wat je in deze training hebt gelogd gaat verloren.', 'Verwijderen', () => A.discardNow()); },
  discardNow() { S.active = null; ui.ed = null; ui.restEnd = 0; ui.sheets = []; saveActive(true); renderAll(); toast('Training verwijderd'); },
  confirmOk() { const s = ui.sheets[ui.sheets.length - 1]; ui.sheets.pop(); renderSheet(); s.fn(); },
  closeSheet() { closeSheet(); },
  addExercise() { openSheet({type: 'picker', q: '', muscle: 'Alle', sel: [], replace: null}); },
  replaceEx() { const ei = ui.sheets[ui.sheets.length - 1].ei; replaceSheet({type: 'picker', q: '', muscle: 'Alle', sel: [], replace: ei}); },
  pickMuscle(el) { const s = ui.sheets[ui.sheets.length - 1]; s.muscle = el.dataset.v; renderSheet(); },
  pickToggle(el) {
    const s = ui.sheets[ui.sheets.length - 1]; const id = el.dataset.id; const w = edW();
    if (s.replace != null) { const e = w.exercises[s.replace]; const oldT = exType(e.exId); e.exId = id; e.name = exInfo(id).name; if (oldT !== exType(id)) e.sets.forEach(x => { x.kg = x.reps = x.sec = x.tkg = x.treps = x.tsec = null; x.done = false; }); closeAllSheets(); edSaved(); renderEditor(true); return; }
    const i = s.sel.indexOf(id); if (i >= 0) s.sel.splice(i, 1); else s.sel.push(id);
    const sc = $('#pickList').scrollTop; renderSheet(); $('#pickList').scrollTop = sc;
  },
  pickAdd() { const s = ui.sheets[ui.sheets.length - 1]; if (!s.sel.length) return; const w = edW(); s.sel.forEach(id => w.exercises.push(newExercise(id))); closeAllSheets(); edSaved(); renderEditor(true); const sc = $('#edScroll'); if (sc) sc.scrollTop = sc.scrollHeight; },
  newCustom() { openSheet({type: 'custom', id: null, draft: {name: (ui.sheets.length && ui.sheets[ui.sheets.length - 1].q) || '', muscle: 'Borst', equip: 'Dumbbell', type: 'wr'}}); },
  editCustom(el) { const c = S.custom.find(x => x.id === el.dataset.id); openSheet({type: 'custom', id: c.id, draft: clone(c)}); },
  cSet(el) { const s = ui.sheets[ui.sheets.length - 1]; s.draft.name = $('#cName').value; s.draft[el.dataset.k] = el.dataset.v; renderSheet(); },
  cSave() {
    const s = ui.sheets[ui.sheets.length - 1]; const name = $('#cName').value.trim(); if (!name) { $('#cName').classList.add('shake'); setTimeout(() => $('#cName') && $('#cName').classList.remove('shake'), 400); return; }
    const d = Object.assign(s.draft, {name, custom: true});
    if (s.id) { const i = S.custom.findIndex(x => x.id === s.id); S.custom[i] = d; } else { d.id = 'c-' + uid(); S.custom.push(d); }
    saveMeta(); touchWorkouts(); ui.sheets.pop();
    const under = ui.sheets[ui.sheets.length - 1]; if (under && under.type === 'picker' && !s.id) { if (under.replace == null) under.sel.push(d.id); under.q = ''; under.muscle = 'Alle'; }
    renderSheet(); renderMain(); toast(s.id ? 'Oefening bijgewerkt' : 'Oefening "' + name + '" aangemaakt');
  },
  deleteCustom(el) { const id = el.dataset.id; confirmSheet('Oefening verwijderen?', 'De oefening verdwijnt uit de lijst. Trainingen waarin je hem deed blijven bewaard.', 'Verwijderen', () => { S.custom = S.custom.filter(x => x.id !== id); S.routines.forEach(r => { r.exercises = r.exercises.filter(e => e.exId !== id); }); saveMeta(); touchWorkouts(); ui.page = null; renderAll(); }); },
  exMenu(el) { openSheet({type: 'exMenu', ei: +el.dataset.ei}); },
  moveEx(el) { const ei = ui.sheets[ui.sheets.length - 1].ei; const w = edW(); const j = ei + +el.dataset.v; [w.exercises[ei], w.exercises[j]] = [w.exercises[j], w.exercises[ei]]; closeAllSheets(); edSaved(); renderEditor(true); },
  removeEx() { const ei = ui.sheets[ui.sheets.length - 1].ei; const w = edW(); w.exercises.splice(ei, 1); cleanSS(w); closeAllSheets(); edSaved(); renderEditor(true); },
  ssStart() { const ei = ui.sheets[ui.sheets.length - 1].ei; replaceSheet({type: 'superset', ei}); },
  ssPick(el) {
    const ei = ui.sheets[ui.sheets.length - 1].ei; const w = edW(); const j = +el.dataset.i; const target = w.exercises[j]; const g = target.superset || nextSSLetter(w);
    target.superset = g; const me = w.exercises.splice(ei, 1)[0]; me.superset = g;
    let last = -1; w.exercises.forEach((x, i) => { if (x.superset === g) last = i; }); w.exercises.splice(last + 1, 0, me);
    closeAllSheets(); edSaved(); renderEditor(true);
  },
  ssRemove() { const ei = ui.sheets[ui.sheets.length - 1].ei; const w = edW(); w.exercises[ei].superset = null; cleanSS(w); closeAllSheets(); edSaved(); renderEditor(true); },
  restPick(el) { openSheet({type: 'rest', ei: +el.dataset.ei}); },
  restSet(el) { const s = ui.sheets[ui.sheets.length - 1]; const v = +el.dataset.v; if (s.ei == null) { S.settings.rest = v; saveMeta(); closeSheet(); return; } edW().exercises[s.ei].rest = v; closeSheet(); edSaved(); renderEditor(true); },
  restAdj(el) { ui.restEnd += +el.dataset.v * 1000; ui.restTotal = Math.max(ui.restTotal + (+el.dataset.v), 1); if (ui.restEnd <= Date.now()) ui.restEnd = 0; updateRest(true); },
  restSkip() { ui.restEnd = 0; updateRest(true); },
  addSet(el) { const e = edW().exercises[+el.dataset.ei]; const last = e.sets[e.sets.length - 1]; const ns = newSet(last); if (last && ui.ed.mode !== 'live') { ns.kg = last.kg; ns.reps = last.reps; ns.sec = last.sec; } if (ui.ed.mode === 'routine' && last) { ns.tkg = last.tkg; ns.treps = last.treps; ns.tsec = last.tsec; } e.sets.push(ns); edSaved(); renderEditor(true); },
  setType(el) { openSheet({type: 'setType', ei: +el.dataset.ei, si: +el.dataset.si}); },
  setTypeSet(el) { const s = ui.sheets[ui.sheets.length - 1]; edW().exercises[s.ei].sets[s.si].type = el.dataset.v; closeSheet(); edSaved(); renderEditor(true); },
  removeSet() { const s = ui.sheets[ui.sheets.length - 1]; const e = edW().exercises[s.ei]; e.sets.splice(s.si, 1); closeSheet(); edSaved(); edStats(); renderEditor(true); },
  rpe(el) { openSheet({type: 'rpe', ei: +el.dataset.ei, si: +el.dataset.si}); },
  rpeSet(el) { const s = ui.sheets[ui.sheets.length - 1]; edW().exercises[s.ei].sets[s.si].rpe = el.dataset.v ? +el.dataset.v : null; closeSheet(); edSaved(); renderEditor(true); },
  usePrev(el) {
    if (ui.ed.mode === 'routine') return; const ei = +el.dataset.ei, si = +el.dataset.si; const e = edW().exercises[ei]; const p = (lastSets(ui.ed.mode === 'edit' ? ui.ed.id : null)[e.exId] || [])[si]; if (!p) return;
    const s = e.sets[si]; s.kg = p.kg; s.reps = p.reps; s.sec = p.sec; edSaved(); edStats(); renderEditor(true);
  },
  check(el) {
    unlockAudio();
    const ei = +el.dataset.ei, si = +el.dataset.si; const w = S.active; const e = w.exercises[ei]; const s = e.sets[si];
    if (s.done) { s.done = false; s.pr = false; saveActive(); renderEditor(true); edStats(); return; }
    if (!fillFromPlaceholder(e, s, si, lastSets(null))) { const row = document.getElementById(`sr-${ei}-${si}`); if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); } toast(exType(e.exId) === 't' ? 'Vul eerst een tijd in' : 'Vul eerst het aantal reps in'); return; }
    s.done = true;
    // live PR check against history
    const t = exType(e.exId); const b = bestsBefore(e.exId, null);
    if (b.n > 0 && s.type !== 'w') { const cur = setStats(zero(), s, t); s.pr = PRKEYS[t].some(k => cur[k] > b[k] + 1e-9); if (s.pr) toast('Nieuw persoonlijk record!'); } else s.pr = false;
    if (e.rest && isLastInSS(w, ei)) startRest(e.rest);
    saveActive(); renderEditor(true); edStats();
  },
};
function closeAllSheets() { ui.sheets = []; renderSheet(); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) { if (ev.target.id === 'sheet') closeSheet(); return; }
  if (el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'exQ') { ui.exQ = t.value; $('#exList').innerHTML = exRows(filterEx(ui.exQ, ui.exMuscle)); return; }
  if (t.id === 'pickQ') { const s = ui.sheets[ui.sheets.length - 1]; s.q = t.value; $('#pickList').innerHTML = pickListHtml(s); return; }
  const f = t.dataset.f; if (!f || !ui.ed) return; const w = edW();
  if (t.tagName === 'TEXTAREA') autoGrow(t);
  if (f === 'wname') w.name = t.value;
  else if (f === 'wnote') w.note = t.value;
  else if (f === 'note') w.exercises[+t.dataset.ei].note = t.value;
  else { const s = w.exercises[+t.dataset.ei].sets[+t.dataset.si]; if (f === 'sec' || f === 'tsec') s[f] = parseTime(t.value); else if (f === 'reps' || f === 'treps') { const v = parseNum(t.value); s[f] = v == null ? null : Math.round(v); } else s[f] = parseNum(t.value); edStats(); }
  edSaved();
});
document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.sr input')) setTimeout(() => { try { ev.target.select(); } catch (e) {} }, 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheets.length) closeSheet(); if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.sr input')) ev.target.blur(); });
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    let d = null; try { d = JSON.parse(r.result); } catch (e) {}
    if (!d || d.app !== 'setboek' || !Array.isArray(d.workouts) || !Array.isArray(d.routines)) { toast('Dit is geen Setboek-back-up'); return; }
    ui.sheets = []; renderSheet();
    confirmSheet('Back-up terugzetten?', `De back-up van ${d.exported ? fShort.format(new Date(d.exported)) : 'onbekende datum'} bevat ${d.workouts.length} trainingen en ${d.routines.length} routines. Wat nu op dit apparaat staat, wordt vervangen.`, 'Terugzetten', () => {
      const old = S.workouts.map(w => w.id);
      S.workouts = d.workouts; S.routines = d.routines; S.custom = Array.isArray(d.custom) ? d.custom : []; S.settings = Object.assign({rest: 90}, d.settings);
      touchWorkouts(); saveMeta();
      if (cloud) { const keep = new Set(S.workouts.map(w => w.id)); old.filter(id => !keep.has(id)).forEach(deleteWorkoutCloud); S.workouts.forEach(saveWorkout); }
      ui.page = null; renderAll(); toast('Back-up teruggezet');
    }, false);
  };
  r.readAsText(ev.target.files[0]);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') writeLocal(); if (document.visibilityState === 'visible') { tick(); if (ui.ed && ui.ed.mode === 'live') requestWake(); refreshCloud(); } });

touchWorkouts();
renderAll();
initCloud();
try { if (!window.claude && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
